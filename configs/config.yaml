server:
  addr: ":8080"
  # 可信代理的 IP/CIDR。**留空 = 谁都不信**,ClientIP() 只认 socket 对端。
  # gin 默认信任所有代理,不配的话 X-Forwarded-For 可以随便伪造,按 IP 的限流直接作废。
  # 每一项在 config.Validate 里就会被 ParseIP/ParseCIDR 校验,拼错就启动失败。
  # trusted_proxies: ["10.0.0.0/8"]

database:
  # 开发用。DSN 带口令,生产环境用 DB_DSN 环境变量覆盖,别往这个文件里写真口令。
  dsn: "host=localhost user=postgres password=123456 dbname=mini_agent_backend port=5432 sslmode=disable"

agent:
  addr: "localhost:50051"
  # 连续多少次"下游有病"就熔断,0 表示关掉熔断。
  # 参数错、方法没实现这类不算 —— 见 agentclient.countsAsUnhealthy。
  breaker_threshold: 5
  # 熔断打开后等多久放一个探针出去。启用熔断时必须大于 0。
  breaker_cooldown: "30s"

# 单用户建任务的配额。每个任务都会驱动一整轮 LLM 循环,不限额的话
# 注册一个号就等于拿到一张无限额度的卡。
quota:
  # 滑动窗口:数的是"此刻往前这么久之内建了几个",不是自然日。
  window: "24h"
  # 窗口内的上限。**设成 0 就关掉配额。**
  # 给得很宽松:这道闸防的是脚本按秒刷,不是正常人手速。
  max_tasks: 200

# 任务回收器:把没人再会来报结果的任务收尾(进程重启、流被掐断、Agent 被 kill)。
reconcile:
  # 多久扫一次。设成 0 就关掉回收器。
  interval: "1m"
  # 中间态任务多久没动静算卡住。比的是**两次事件之间的间隔**,不是任务总时长 ——
  # 还在推进度的任务会一直被续命(见 TaskService.Heartbeat),不会被误杀。
  stale_after: "15m"
  # 一轮最多收几个。收不完下一轮接着来。
  batch: 100

jwt:
  # 签发方标识,会写进 iss 并在校验时核对。
  issuer: "mini-agent"
  # 访问令牌有效期。没有吊销机制,改密码/封号都拦不住已签出的令牌,所以别配太长。
  access_ttl: "2h"
  # 签名密钥不在这里 —— 只从 JWT_SECRET 环境变量读,至少 32 字节。
  # 生成一个:openssl rand -base64 48

# Redis。**addr 为空就不启用限流**(默认就是空),服务其余部分照常工作,
# 启动时会打一条 Warn 说明这个部署没有这层防护。
# 口令不在这里 —— 只从 REDIS_PASSWORD 环境变量读(字段上打了 yaml:"-")。
redis:
  addr: ""
  db: 0

# 限流。每一层 limit 设成 0 就关掉那一层;redis.addr 为空时整块都不生效。
#
# 三种控制回答三个不同的问题,不能互相替代:
#   quota 管"总共能建多少"、这里管"多久来一个"、并发信号量管"同时几个在跑"(还没做)。
rate_limit:
  # 登录/注册的全局闸。**这是过载保护,不是安全措施**:
  # bcrypt cost 12 一次约 160ms,50/s 要 8 核专门伺候才扛得住 ——
  # 定在 10/s 这道闸才真的会生效,而不是永远触发不了的装饰。
  # login 和 register **各算一个桶**,所以 bcrypt 的总负载上限是 20/s:
  # 注册被刷爆不该连带把老用户锁在登录之外。
  auth_global_limit: 10
  auth_global_window: "1s"

  # 按 IP。**必须比 email 高一个数量级** —— 两个维度防的不是一回事,
  # 拿 email 的阈值去卡 IP,一个公司/学校的 NAT 出口(整栋楼共用一个 IP)会被整体误伤。
  ip_limit: 30
  ip_window: "1m"

  # 按邮箱。**真正在防撞库的就是这一层** —— 撞库就是对着同一个账号试口令。
  # 邮箱进 key 之前会过 HMAC(Redis 的 key 会出现在 SLOWLOG / MONITOR / 面板里)。
  email_limit: 5
  email_window: "1m"

  # 建任务的全局闸。挡突发脚本,给 Agent 留口气。
  # 注意它**挡不住并发**:稳定 5/s 持续半小时就是 9000 个在跑的任务,
  # 而 agentclient 至今没有并发上限。要管并发得上信号量。
  chat_global_limit: 5
  chat_global_window: "1s"

  # 建任务,按登录用户。和 quota 的 200/24h 是两件事:那是总量,这是速率。
  chat_user_limit: 10
  chat_user_window: "1m"

# 实时推送(SSE)。事件在库里,Redis Pub/Sub 只做「有更新了」的唤醒信号 ——
# 信号丢了不丢数据,只丢实时性(还有定时轮询兜底)。
sse:
  # 关掉的话这条接口回 503(前端退回轮询),不是 404。
  enabled: true
  # 兜底轮询间隔。信号可能丢(Redis 抖动、副本重启),所以还要定时读一次库。
  # **没配 Redis 时,这是唯一的推送来源** —— SSE 仍然可用,只是延迟一个轮询周期。
  poll_interval: "1s"
  # 心跳间隔。nginx 的 proxy_read_timeout 默认 60s,不心跳连接会被静默掐断,
  # 而客户端分不清「服务端不说话」和「连接断了」。
  heartbeat: "15s"
  # 单个会话最多几条连接(软限制)。同一个用户开两个标签页够用。
  max_conn_per_session: 2
  # 全进程最多几条连接(软限制)。无限 SSE 连接会打爆 backend 内存。
  # ★ 是**每进程**的,不是全集群的:多副本部署时实际是「副本数 × 这个值」。
  max_conn_total: 1000
  # 单个用户最多几条连接(软限制)。
  # 不能只有"每会话"和"全局"两个闸:一个账号有 N 个会话就能开 N×2 条连接,
  # 把全局预算吃光,于是别的用户全部连不上 —— 那等于一个账号替所有人做决定。
  max_conn_per_user: 20
  # 一次读多少条事件。一批读满就接着读下一批,所以这个值不影响"一条都不漏"。
  replay_limit: 200
  # 一轮推送最多下发多少条事件。
  # 和 replay_limit 分开:一轮推送可能读好几批,而一个攒了几万条事件的会话
  # 一次重连就会把整段历史一口气写出去 —— 那是一次性放大,单次查询上限拦不住。
  # ★ 超出的部分**不会丢**:游标已经推进,剩下的下一轮继续发。
  max_replay_per_drain: 1000
